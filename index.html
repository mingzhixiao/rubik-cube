<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 魔方</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a1a;
  font-family: 'Segoe UI', sans-serif;
  overflow: hidden;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  user-select: none;
}
h1 {
  color: #fff;
  font-size: 28px;
  margin-bottom: 10px;
  text-shadow: 0 0 20px rgba(100,200,255,0.5);
  letter-spacing: 4px;
}
.info {
  color: #8af;
  font-size: 14px;
  margin-bottom: 15px;
  opacity: 0.8;
}
canvas { display: block; cursor: grab; }
canvas:active { cursor: grabbing; }
.controls {
  position: fixed;
  bottom: 20px;
  display: flex;
  gap: 10px;
  z-index: 10;
}
.btn {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  color: #fff;
  padding: 10px 20px;
  border-radius: 25px;
  cursor: pointer;
  font-size: 14px;
  backdrop-filter: blur(10px);
  transition: all 0.3s;
}
.btn:hover {
  background: rgba(255,255,255,0.2);
  border-color: rgba(100,200,255,0.5);
  box-shadow: 0 0 15px rgba(100,200,255,0.3);
}
.timer {
  position: fixed;
  top: 15px;
  right: 20px;
  color: #8ff;
  font-size: 20px;
  font-family: monospace;
  text-shadow: 0 0 10px rgba(100,255,255,0.5);
}
.moves {
  position: fixed;
  top: 15px;
  left: 20px;
  color: #f8f;
  font-size: 16px;
  text-shadow: 0 0 10px rgba(255,100,255,0.5);
}
.win-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  z-index: 100;
}
.win-overlay.show { display: flex; }
.win-overlay h2 {
  color: #fff;
  font-size: 48px;
  text-shadow: 0 0 30px rgba(255,215,0,0.8);
  margin-bottom: 20px;
}
.win-overlay p {
  color: #adf;
  font-size: 20px;
  margin-bottom: 30px;
}
</style>
</head>
<body>
<h1>🎲 3D 魔方</h1>
<p class="info">拖拽旋转魔方 · 点击色块转动面 · 滚轮缩放</p>
<div class="moves" id="moves">步数: 0</div>
<div class="timer" id="timer">00:00</div>
<canvas id="c"></canvas>
<div class="controls">
  <button class="btn" onclick="scrambleCube()">打乱</button>
  <button class="btn" onclick="resetCube()">重置</button>
</div>
<div class="win-overlay" id="winOverlay">
  <h2>🎉 恭喜通关!</h2>
  <p id="winInfo"></p>
  <button class="btn" onclick="closeWin()">再来一次</button>
</div>

<script>
// ===== 3D Rubik's Cube Engine =====
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// 3D math
function vec3(x,y,z) { return {x,y,z}; }
function add(a,b) { return vec3(a.x+b.x,a.y+b.y,a.z+b.z); }
function sub(a,b) { return vec3(a.x-b.x,a.y-b.y,a.z-b.z); }
function scale(v,s) { return vec3(v.x*s,v.y*s,v.z*s); }
function dot(a,b) { return a.x*b.x+a.y*b.y+a.z*b.z; }
function cross(a,b) { return vec3(a.y*b.z-a.z*b.y, a.z*b.x-a.x*b.z, a.x*b.y-a.y*b.x); }
function len(v) { return Math.sqrt(v.x*v.x+v.y*v.y+v.z*v.z); }
function normalize(v) { const l=len(v); return l>0?scale(v,1/l):vec3(0,0,0); }

function rotateX(v,a) {
  const c=Math.cos(a),s=Math.sin(a);
  return vec3(v.x, v.y*c-v.z*s, v.y*s+v.z*c);
}
function rotateY(v,a) {
  const c=Math.cos(a),s=Math.sin(a);
  return vec3(v.x*c+v.z*s, v.y, -v.x*s+v.z*c);
}
function rotateZ(v,a) {
  const c=Math.cos(a),s=Math.sin(a);
  return vec3(v.x*c-v.y*s, v.x*s+v.y*c, v.z);
}

function project(v) {
  const d = 6;
  const z = v.z + d;
  const f = d / z * 300;
  return { x: W/2 + v.x*f, y: H/2 - v.y*f, z: v.z, f };
}

// Colors
const COLORS = {
  U: '#ffffff', D: '#ffd500', F: '#ff0000',
  B: '#ff8800', L: '#00cc00', R: '#0066ff',
  inner: '#1a1a2e'
};

// Cube state: 6 faces, each 3x3
// Faces: U(0), D(1), F(2), B(3), L(4), R(5)
let cubeState = [];
let moveCount = 0;
let startTime = null;
let timerInterval = null;
let isSolved = true;

function initState() {
  cubeState = [];
  for (let f = 0; f < 6; f++) {
    cubeState[f] = [];
    for (let r = 0; r < 3; r++) {
      cubeState[f][r] = [];
      for (let c = 0; c < 3; c++) {
        cubeState[f][r][c] = f;
      }
    }
  }
}
initState();

const FACE_NAMES = ['U','D','F','B','L','R'];

// Build 3D geometry for a cubie
function buildCubies() {
  const cubies = [];
  const gap = 0.05;
  const size = 0.9;
  
  for (let x = -1; x <= 1; x++) {
    for (let y = -1; y <= 1; y++) {
      for (let z = -1; z <= 1; z++) {
        const cx = x * 1.05;
        const cy = y * 1.05;
        const cz = z * 1.05;
        const s = size / 2;
        
        // Each cubie has up to 3 visible faces
        const faces = [];
        
        // +Y face (U)
        if (y == 1) faces.push({
          verts: [
            vec3(cx-s,cy+s,cz-s), vec3(cx+s,cy+s,cz-s),
            vec3(cx+s,cy+s,cz+s), vec3(cx-s,cy+s,cz+s)
          ],
          face: 'U', row: 1-z, col: 1+x
        });
        // -Y face (D)
        if (y == -1) faces.push({
          verts: [
            vec3(cx-s,cy-s,cz+s), vec3(cx+s,cy-s,cz+s),
            vec3(cx+s,cy-s,cz-s), vec3(cx-s,cy-s,cz-s)
          ],
          face: 'D', row: 1+z, col: 1+x
        });
        // +Z face (F)
        if (z == 1) faces.push({
          verts: [
            vec3(cx-s,cy-s,cz+s), vec3(cx-s,cy+s,cz+s),
            vec3(cx+s,cy+s,cz+s), vec3(cx+s,cy-s,cz+s)
          ],
          face: 'F', row: 1-y, col: 1+x
        });
        // -Z face (B)
        if (z == -1) faces.push({
          verts: [
            vec3(cx+s,cy-s,cz-s), vec3(cx+s,cy+s,cz-s),
            vec3(cx-s,cy+s,cz-s), vec3(cx-s,cy-s,cz-s)
          ],
          face: 'B', row: 1-y, col: 1-x
        });
        // -X face (L)
        if (x == -1) faces.push({
          verts: [
            vec3(cx-s,cy-s,cz-s), vec3(cx-s,cy+s,cz-s),
            vec3(cx-s,cy+s,cz+s), vec3(cx-s,cy-s,cz+s)
          ],
          face: 'L', row: 1-y, col: 1+z
        });
        // +X face (R)
        if (x == 1) faces.push({
          verts: [
            vec3(cx+s,cy-s,cz+s), vec3(cx+s,cy+s,cz+s),
            vec3(cx+s,cy+s,cz-s), vec3(cx+s,cy-s,cz-s)
          ],
          face: 'R', row: 1-y, col: 1-z
        });
        
        cubies.push({ x, y, z, faces });
      }
    }
  }
  return cubies;
}

const cubies = buildCubies();

// Rotation state
let animating = false;
let animAxis = '', animLayer = 0, animAngle = 0, animTarget = 0;
let animCallback = null;

// Camera
let camRotX = -0.5;
let camRotY = 0.6;
let camZoom = 1;

// Apply rotation to a vector
function applyRot(v) {
  let r = rotateX(v, camRotX);
  r = rotateY(r, camRotY);
  return r;
}

// Get face color from state
function getFaceColor(face, row, col) {
  const fi = FACE_NAMES.indexOf(face);
  if (fi < 0) return COLORS.inner;
  return FACE_NAMES[fi].replace('U','#fff').replace('D','#ffd500').replace('F','#f00').replace('B','#f80').replace('L','#0c0').replace('R','#06f') || COLORS.inner;
}

const colorMap = {0:'#fff',1:'#ffd500',2:'#f00',3:'#f80',4:'#0c0',5:'#06f'};

function getStickerColor(face, row, col) {
  const fi = FACE_NAMES.indexOf(face);
  if (fi < 0) return '#1a1a2e';
  const val = cubeState[fi][row][col];
  return colorMap[val] || '#1a1a2e';
}

// Draw
function draw() {
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, W, H);
  
  // Ambient grid
  ctx.strokeStyle = 'rgba(50,80,120,0.1)';
  for (let i = 0; i < W; i += 40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,H); ctx.stroke(); }
  for (let i = 0; i < H; i += 40) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(W,i); ctx.stroke(); }
  
  // Collect all faces with depth
  const allFaces = [];
  
  cubies.forEach(cubie => {
    let { x, y, z, faces } = cubie;
    let v = vec3(x, y, z);
    
    // Apply animation rotation
    if (animating) {
      v = applyAnimRot(v);
    }
    
    faces.forEach(f => {
      let verts = f.verts.map(vv => {
        let pv = vv;
        if (animating) pv = applyAnimRot(pv);
        pv = applyRot(pv);
        return project(pv);
      });
      
      const avgZ = verts.reduce((s,v) => s+v.z, 0) / 4;
      
      let color;
      if (animating && isAnimFace(f)) {
        color = getStickerColor(f.face, f.row, f.col);
      } else {
        color = getStickerColor(f.face, f.row, f.col);
      }
      
      allFaces.push({ verts, color, z: avgZ, face: f });
    });
  });
  
  // Sort by depth (painter's algorithm)
  allFaces.sort((a,b) => b.z - a.z);
  
  // Draw faces
  allFaces.forEach(({verts, color}) => {
    ctx.beginPath();
    ctx.moveTo(verts[0].x, verts[0].y);
    for (let i = 1; i < verts.length; i++) ctx.lineTo(verts[i].x, verts[i].y);
    ctx.closePath();
    
    // Gradient shading
    const grad = ctx.createLinearGradient(verts[0].x, verts[0].y, verts[2].x, verts[2].y);
    grad.addColorStop(0, lighten(color, 20));
    grad.addColorStop(1, darken(color, 20));
    ctx.fillStyle = grad;
    ctx.fill();
    
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Inner rounded rect effect
    ctx.beginPath();
    const mx = verts.reduce((s,v)=>s+v.x,0)/4;
    const my = verts.reduce((s,v)=>s+v.y,0)/4;
    const shrink = 0.85;
    const iv = verts.map(v => ({x: mx+(v.x-mx)*shrink, y: my+(v.y-my)*shrink}));
    ctx.moveTo(iv[0].x, iv[0].y);
    for (let i = 1; i < iv.length; i++) ctx.lineTo(iv[i].x, iv[i].y);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();
  });
}

function lighten(hex, pct) {
  let r = parseInt(hex.slice(1,3),16);
  let g = parseInt(hex.slice(3,5),16);
  let b = parseInt(hex.slice(5,7),16);
  r = Math.min(255, r + pct*2.55)|0;
  g = Math.min(255, g + pct*2.55)|0;
  b = Math.min(255, b + pct*2.55)|0;
  return `rgb(${r},${g},${b})`;
}
function darken(hex, pct) {
  let r = parseInt(hex.slice(1,3),16);
  let g = parseInt(hex.slice(3,5),16);
  let b = parseInt(hex.slice(5,7),16);
  r = Math.max(0, r - pct*2.55)|0;
  g = Math.max(0, g - pct*2.55)|0;
  b = Math.max(0, b - pct*2.55)|0;
  return `rgb(${r},${g},${b})`;
}

function applyAnimRot(v) {
  const a = animAngle;
  if (animAxis === 'x') {
    if (v.x === animLayer) return rotateX(v, a);
  } else if (animAxis === 'y') {
    if (v.y === animLayer) return rotateY(v, a);
  } else if (animAxis === 'z') {
    if (v.z === animLayer) return rotateZ(v, a);
  }
  return v;
}

function isAnimFace(f) {
  // Check if this face's cubie is in the animating layer
  return true; // simplified
}

// Face rotation logic
function rotateFace(face, dir) {
  if (animating) return;
  
  const axisMap = {
    'U': { axis: 'y', layer: 1 },
    'D': { axis: 'y', layer: -1 },
    'R': { axis: 'x', layer: 1 },
    'L': { axis: 'x', layer: -1 },
    'F': { axis: 'z', layer: 1 },
    'B': { axis: 'z', layer: -1 }
  };
  
  const { axis, layer } = axisMap[face];
  animAxis = axis;
  animLayer = layer;
  animAngle = 0;
  animTarget = dir * Math.PI / 2;
  animating = true;
  
  moveCount++;
  document.getElementById('moves').textContent = `步数: ${moveCount}`;
  
  if (!startTime) startTimer();
}

function animStep() {
  const speed = 0.12;
  const diff = animTarget - animAngle;
  
  if (Math.abs(diff) < 0.01) {
    animAngle = animTarget;
    animating = false;
    applyStateRotation(animAxis, animLayer, animTarget > 0 ? 1 : -1);
    draw();
    checkSolved();
    return;
  }
  
  animAngle += diff * 0.2;
  draw();
  requestAnimationFrame(animStep);
}

function applyStateRotation(axis, layer, dir) {
  // Rotate the cube state array
  const face = axis === 'y' ? (layer === 1 ? 0 : 1) :
               axis === 'x' ? (layer === 1 ? 5 : 4) :
               (layer === 1 ? 2 : 3);
  
  // Rotate face stickers
  rotateFaceStickers(face, dir);
  
  // Rotate adjacent edges
  rotateEdges(axis, layer, dir);
}

function rotateFaceStickers(face, dir) {
  const s = cubeState[face];
  const ns = s.map(r => [...r]);
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < 3; c++) {
      if (dir === 1) ns[c][2-r] = s[r][c];
      else ns[2-c][r] = s[r][c];
    }
  }
  cubeState[face] = ns;
}

function rotateEdges(axis, layer, dir) {
  // Map of which faces share edges on each axis/layer
  const edgeMap = {
    'y': {
      1: [ // U layer
        { face: 2, rows: [0], cols: [0,1,2] }, // F top
        { face: 5, rows: [0], cols: [0,1,2] }, // R top
        { face: 3, rows: [0], cols: [0,1,2] }, // B top
        { face: 4, rows: [0], cols: [0,1,2] }  // L top
      ],
      '-1': [ // D layer
        { face: 2, rows: [2], cols: [0,1,2] },
        { face: 4, rows: [2], cols: [0,1,2] },
        { face: 3, rows: [2], cols: [0,1,2] },
        { face: 5, rows: [2], cols: [0,1,2] }
      ]
    }
  };
  
  // Simplified: just rotate the face for now
  // Full edge rotation would be more complex
}

// Mouse interaction
let dragging = false;
let lastMouse = { x: 0, y: 0 };

canvas.addEventListener('mousedown', e => {
  dragging = true;
  lastMouse = { x: e.clientX, y: e.clientY };
});

canvas.addEventListener('mousemove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastMouse.x;
  const dy = e.clientY - lastMouse.y;
  camRotY += dx * 0.008;
  camRotX += dy * 0.008;
  camRotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, camRotX));
  lastMouse = { x: e.clientX, y: e.clientY };
  draw();
});

canvas.addEventListener('mouseup', () => { dragging = false; });
canvas.addEventListener('mouseleave', () => { dragging = false; });

canvas.addEventListener('wheel', e => {
  camZoom += e.deltaY * -0.001;
  camZoom = Math.max(0.5, Math.min(2, camZoom));
  draw();
  e.preventDefault();
}, { passive: false });

// Touch support
let lastTouch = null;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }
});
canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && lastTouch) {
    const dx = e.touches[0].clientX - lastTouch.x;
    const dy = e.touches[0].clientY - lastTouch.y;
    camRotY += dx * 0.008;
    camRotX += dy * 0.008;
    camRotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, camRotX));
    lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    draw();
  }
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchend', () => { lastTouch = null; });

// Keyboard controls
document.addEventListener('keydown', e => {
  const key = e.key.toUpperCase();
  const dir = e.shiftKey ? -1 : 1;
  if ('UDFBLR'.includes(key)) {
    rotateFace(key, dir);
    requestAnimationFrame(animStep);
  }
});

// Scramble
function scrambleCube() {
  const faces = ['U','D','F','B','L','R'];
  let count = 0;
  const maxMoves = 20;
  
  function doScramble() {
    if (count >= maxMoves) return;
    const face = faces[Math.random()*6|0];
    const dir = Math.random() > 0.5 ? 1 : -1;
    rotateFace(face, dir);
    count++;
    setTimeout(() => {
      // Force complete animation instantly
      animating = false;
      applyStateRotation(animAxis, animLayer, animTarget > 0 ? 1 : -1);
      doScramble();
    }, 50);
  }
  
  moveCount = 0;
  document.getElementById('moves').textContent = '步数: 0';
  resetTimer();
  doScramble();
}

function resetCube() {
  initState();
  moveCount = 0;
  document.getElementById('moves').textContent = '步数: 0';
  resetTimer();
  draw();
}

function checkSolved() {
  for (let f = 0; f < 6; f++) {
    const val = cubeState[f][1][1];
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 3; c++) {
        if (cubeState[f][r][c] !== val) return;
      }
    }
  }
  // Solved!
  isSolved = true;
  stopTimer();
  const time = document.getElementById('timer').textContent;
  document.getElementById('winInfo').textContent = `${moveCount} 步 · ${time}`;
  document.getElementById('winOverlay').classList.add('show');
}

function closeWin() {
  document.getElementById('winOverlay').classList.remove('show');
  scrambleCube();
}

// Timer
function startTimer() {
  startTime = Date.now();
  timerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const m = String(elapsed / 60 | 0).padStart(2, '0');
    const s = String(elapsed % 60).padStart(2, '0');
    document.getElementById('timer').textContent = `${m}:${s}`;
  }, 1000);
}

function stopTimer() {
  clearInterval(timerInterval);
}

function resetTimer() {
  stopTimer();
  startTime = null;
  document.getElementById('timer').textContent = '00:00';
}

// Override animStep to handle scramble speed
const origAnimStep = animStep;

// Main loop
function loop() {
  if (animating) animStep();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
